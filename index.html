<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <title>A tree?...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <img src="tree.gif" alt="Tree">

    <audio id="bgMusic" loop autoplay>
        <source src="man.ogg" type="audio/ogg">
        Well, seems a bit too quite, dont'a think?
    </audio>

    <script>
        const audio = document.getElementById("bgMusic");

        // Some browsers block autoplay until user interaction.
        audio.play().catch(() => {
            const startAudio = () => {
                audio.play();
                document.removeEventListener("click", startAudio);
                document.removeEventListener("keydown", startAudio);
                document.removeEventListener("touchstart", startAudio);
            };

            document.addEventListener("click", startAudio);
            document.addEventListener("keydown", startAudio);
            document.addEventListener("touchstart", startAudio);
        });
    </script>
<video id="secretVideo" width="600" style="display:none;">
    <source src="video-output-92DEDOC9-7C2D-478D-BB1D-0D45D7646A78-1.mp4" type="video/mp4">
</video>

<script>
let clicks = 0;
let hasPlayed = false;

document.addEventListener("click", () => {
    if (hasPlayed) return;

    clicks++;

    if (clicks === 5) {
        hasPlayed = true;

        const video = document.getElementById("secretVideo");
        video.style.display = "block"; // Show it
        video.play();                  // Play once
    }
});
</script>
</body>
</html>
